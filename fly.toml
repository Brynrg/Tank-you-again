# Fly.io configuration for the Tank You Again game server.
#
# Bootstrap once with:   fly launch --no-deploy --copy-config
# Then set the DB url:   fly secrets set DATABASE_URL="postgresql://..."
# Then deploy:           fly deploy
#
# Free tier: keep machines at shared-cpu-1x w/ 256MB and 1 region. WebSockets
# work out of the box on Fly's edge — no extra config needed.

app = "tank-you-again"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # WebSocket upgrades pass straight through.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
