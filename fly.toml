# fly.toml app configuration file generated for tank-you-again on 2026-05-16T18:19:54-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tank-you-again'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  # Scale-to-zero so the multiplayer server costs nothing while idle. Fly stops
  # the machine after a period of no traffic and auto-starts it on the next
  # connection. Trade-offs: the first multiplayer connection after an idle
  # period waits a few seconds for a cold start, and the single global in-memory
  # arena resets when the machine sleeps. Single-player is unaffected — it runs
  # entirely in the browser and never touches this server.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
