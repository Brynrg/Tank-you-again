name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test --if-present

      - name: Build (server bundle + client)
        run: npm run build

      - name: Smoke-check built client
        run: |
          test -f client/dist/index.html || (echo "client/dist/index.html missing" && exit 1)
          test -f client/dist/game.manifest.json || (echo "client/dist/game.manifest.json missing" && exit 1)

      - name: Format check
        run: npm run format:check
