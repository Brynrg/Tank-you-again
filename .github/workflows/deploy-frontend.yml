name: Deploy frontend to speedrungames.net

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  GAME_SLUG: tank-you-again
  TARGET_REPO: Brynrg/speedrungames
  TARGET_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Checkout Tank-you-again
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck client
        run: npm run typecheck --workspace=client

      - name: Build client (Vite) with subpath base
        run: npx vite build --base=/games/${{ env.GAME_SLUG }}/
        working-directory: client
        env:
          NODE_ENV: production
          # Set this once the Fly.io backend exists:
          #   gh secret set VITE_WS_URL --body "wss://tank-you-again.fly.dev/ws"
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Verify build output
        run: |
          test -f client/dist/index.html
          test -d client/dist/assets
          ls -lah client/dist

      - name: Checkout target site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SPEEDRUNGAMES_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: site

      - name: Replace static game files
        run: |
          DEST="site/apps/web/public/games/${GAME_SLUG}"
          mkdir -p "$DEST"
          rm -rf "$DEST"/*
          cp -R client/dist/. "$DEST"/

      - name: Commit & push if changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/public/games/${GAME_SLUG}"
          if git diff --cached --quiet; then
            echo "No changes — already up to date."
            exit 0
          fi
          SHORT_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          git commit -m "Sync ${GAME_SLUG} from Tank-you-again@${SHORT_SHA}"
          git push origin "${TARGET_BRANCH}"
