name: CI + Deploy

# Single source of truth for both verification and deployment. The pipeline is:
#
#   1. `ci` runs typecheck + tests + build + format-check on every push and PR.
#   2. `deploy-backend` runs ONLY when `ci` passes AND a backend-relevant path changed.
#   3. `deploy-frontend` runs ONLY when `ci` passes AND a client-relevant path changed.
#
# The strict `needs: ci` gate means a broken push (TS error, failing test, format
# drift) never reaches production — Fly stays on the last green image, and the
# portal copy of the game stays on the last green client bundle.
#
# Schema-change detection: if `server/prisma/schema.prisma` changed, the backend
# deploy refuses to ship — the new server would crash trying to read columns
# that don't exist yet on Neon. Apply the migration manually first:
#   DATABASE_URL='...' npx prisma db push --schema=server/prisma/schema.prisma
# Then re-run the workflow via the Actions UI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
      schema_changed: ${{ steps.changes.outputs.schema }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      # Backend only. The client is built + shipped via its own
      # .github/workflows/deploy.yml (Vite/esbuild, no tsc), so the backend
      # deploy gate must not hang on the client's separate pre-existing
      # type-debt. Run `npm run typecheck:client` to see/fix that debt.
      - name: Typecheck (backend: shared + server + scripts)
        run: npm run typecheck:backend

      - name: Unit tests
        run: npm test

      - name: Build (server bundle + client + stage dist)
        run: npm run build

      - name: Smoke-check built client
        run: |
          test -f client/dist/index.html || (echo "client/dist/index.html missing" && exit 1)
          test -f client/dist/game.manifest.json || (echo "client/dist/game.manifest.json missing" && exit 1)

      - name: Format check
        run: npm run format:check

      - name: Detect which surfaces changed
        id: changes
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          {
            if echo "$CHANGED" | grep -qE '^(server/|shared/|Dockerfile|fly\.toml|package(-lock)?\.json|tsconfig\.json|\.github/workflows/)'; then
              echo "backend=true"
            else
              echo "backend=false"
            fi
            if echo "$CHANGED" | grep -qE '^(client/|shared/|package(-lock)?\.json|tsconfig\.json|\.github/workflows/)'; then
              echo "frontend=true"
            else
              echo "frontend=false"
            fi
            if echo "$CHANGED" | grep -qE '^server/prisma/schema\.prisma$'; then
              echo "schema=true"
            else
              echo "schema=false"
            fi
          } >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: ci
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Refuse to deploy if Prisma schema changed without manual migration
        if: needs.ci.outputs.schema_changed == 'true'
        run: |
          echo "::error::server/prisma/schema.prisma changed in this push."
          echo "::error::Auto-deploying would ship a server that crashes on the first query."
          echo "::error::Run this against your Neon DATABASE_URL, then re-run the workflow:"
          echo "::error::  DATABASE_URL='...' npx prisma db push --schema=server/prisma/schema.prisma"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # NOTE: the old `deploy-frontend` job (raw `cp -R client/dist` into the portal)
  # was REMOVED. It hand-copied build output, which buried a build in a dist/
  # subfolder and shipped a "no visible change" deploy. Client deploys now go
  # through .github/workflows/deploy.yml -> the portal reusable workflow
  # (Brynrg/speedrungames/.github/workflows/deploy-game.yml), which runs the
  # canonical ingest and opens an auto-merging portal PR. Never hand-copy.
