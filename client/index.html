<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tank You Again</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b14;
        color: #facc15;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        /* Mobile: kill pinch-zoom, double-tap-zoom, scroll bounce, and the grey
           tap-flash so the canvas behaves like a native game surface. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game {
        display: block;
        background: #0b0b14;
        image-rendering: pixelated;
        /* dvh tracks the *visible* viewport (handles the iOS URL bar); vh is the
           fallback. main.ts does authoritative sizing via visualViewport. */
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1024" height="768"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
