<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Tank You Again</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b14;
        color: #facc15;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        display: block;
        background: #1a1a2e;
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 100vh;
        outline: 1px solid #facc1533;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1024" height="768"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
